apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carmen-ingress
  namespace: miportafolio
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: webmiportfolio.es
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: carmen-service
                port:
                  number: 80
    - host: www.webmiportfolio.es
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: carmen-service
                port:
                  number: 80
