<!DOCTYPE html>
<html lang="es">
<head>

    <style>
        body {

            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        }
        .container {
            background: rgba(255, 255, 255, 0.1);

            border-radius: 10px;

            margin-bottom: 30px;
        }

            background: rgba(255, 255, 255, 0.2);

        </div>
        
        <div class="info">

        </div>
        
        <div class="info">

        </div>
