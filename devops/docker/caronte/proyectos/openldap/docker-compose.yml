version: "3.8"

services:
  # Servidor OpenLDAP con SSH
  openldap:
    container_name: openldap_server
    build:
      context: ../../
      dockerfile: dockerfiles/openldap/Dockerfile
    environment:
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=admin
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    ports:
      - "389:389" # LDAP
      - "636:636" # LDAPS
      - "2223:22" # SSH para mantenimiento
    restart: always

  # GUI web para administrar LDAP
  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin_gui
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
      - PHPLDAPADMIN_HTTPS=false
    ports:
      - "6443:80"
    depends_on:
      - openldap
    restart: always

volumes:
  ldap_data:
  ldap_config:
