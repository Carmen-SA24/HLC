apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pokemon-ingress
  namespace: proyectopokemon
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: pokemon.carmenasir.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pokemon-service
                port:
                  number: 80
