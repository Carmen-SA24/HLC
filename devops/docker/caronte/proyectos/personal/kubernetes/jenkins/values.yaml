controller:
  image:
    repository: jenkins/jenkins
    tag: "2.541.1-lts-jdk21"
  runAsUser: 1000
  fsGroup: 1000
  admin:
    username: admin
    password: admin123
  persistence:
    enabled: true
    size: 8Gi
    storageClass: microk8s-hostpath
  serviceType: ClusterIP
  servicePort: 8080

  ingress:
    enabled: true
    ingressClassName: nginx
    hostName: jenkins.carmen.es
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    tls:
      - secretName: jenkins-tls
        hosts:
          - jenkins.carmen.es

sidecars:
  configAutoReload:
    enabled: true
    image:
      repository: kiwigrid/k8s-sidecar
      tag: "1.27.4"

installPlugins:
  - configuration-as-code
  - kubernetes
  - workflow-aggregator
  - credentials
  - github
  - git

# --- BLOQUES FALTANTES PARA EVITAR ERRORES ---

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true
  readSecrets: true

autoscaling:
  enabled: false