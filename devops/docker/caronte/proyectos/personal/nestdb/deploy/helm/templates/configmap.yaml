apiVersion: v1
kind: ConfigMap
metadata:
  name: config-{{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
data:
  DB_HOST: {{ .Values.postgres.name | quote }}
  DB_PORT: {{ .Values.postgres.service.port | quote }}
  DB_NAME: {{ .Values.postgres.auth.database | quote }}
  DB_USERNAME: {{ .Values.postgres.auth.username | quote }}
  DB_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  PORT: {{ .Values.app.container.port | quote }}
  USUARIO: {{ .Values.app.container.user | quote }}
  PORT_SSH: {{ .Values.app.container.sshPort | quote }}
  DB_SYNC: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-replication-script
  namespace: {{ .Release.Namespace }}
data:
  setup-replication.sh: |
    #!/bin/bash
    set -e
    HOSTNAME=$(hostname)
    ORDINAL=${HOSTNAME##*-}
    PGDATA="/var/lib/postgresql/data"
    
    echo "=== Setup PostgreSQL Replication ==="
    echo "Pod: $HOSTNAME, Ordinal: $ORDINAL"
    
    if [ "$ORDINAL" = "0" ]; then
      echo "*** PRIMARY ***"
      if [ -s "$PGDATA/PG_VERSION" ]; then
        cat >> $PGDATA/postgresql.conf <<EOF
wal_level = replica
max_wal_senders = 5
wal_keep_size = 128
hot_standby = on
EOF
        cat >> $PGDATA/pg_hba.conf <<EOF
host replication all all md5
EOF
        echo "✓ Primary configured"
      fi
    else
      echo "*** REPLICA ***"
      PRIMARY="statefull-{{ .Values.postgres.name }}-0.{{ .Values.postgres.name }}.{{ .Release.Namespace }}.svc.cluster.local"
      
      if [ ! -s "$PGDATA/PG_VERSION" ]; then
        echo "Waiting for Primary..."
        for i in {1..30}; do
          pg_isready -h $PRIMARY -p 5432 -U ${POSTGRES_USER} && break
          sleep 5
        done
        
        rm -rf $PGDATA/*
        echo "Copying from Primary..."
        PGPASSWORD=${POSTGRES_PASSWORD} pg_basebackup -h $PRIMARY -D $PGDATA -U ${POSTGRES_USER} -v -P -X stream -R
        echo "✓ Replica configured"
      fi
    fi
