apiVersion: v1
kind: Service
metadata:
  name: service-{{ .Values.app.name }}
  namespace: { { .Release.Namespace } }
spec:
  type: NodePort
  selector:
    app: { { .Values.app.name } }
  ports:
    - name: http
      port: { { .Values.app.service.port } }
      targetPort: { { .Values.app.container.port } }
      nodePort: 30095
    - name: ssh
      port: 2222
      targetPort: { { .Values.app.container.sshPort } }
      nodePort: 31535
