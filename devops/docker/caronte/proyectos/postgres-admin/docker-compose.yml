version: "3.8"

services:
  # Servidor PostgreSQL con SSH
  postgres:
    container_name: postgres_db
    build:
      context: ../../
      dockerfile: dockerfiles/sgbd/postgres/Dockerfile
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=main_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # PostgreSQL
      - "2224:22" # SSH para mantenimiento
    restart: always

  # GUI web para administrar PostgreSQL
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_web
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data:
  pgadmin_data:
