version: '3.9'
services:
  web:
    build:
      context: ${CONTEXTO}
      dockerfile: ./dockerfiles/base/ubbase
      # args:  variables en DFILE para la construccion (build de la imagen)
        # - USUARIO=alfonso
        # - PASSWORD=1234
    container_name: ${CONTENEDOR}
    env_file:  ./.env
    # environment: # si necesito alguna variable de entorno que no esté en .env 
    #   - USUARIO=alfonso
    #   - PASSWORD=pswalfonso
    ports:
      - "45678:45678"
    volumes:
      - ./logs:/root/logs
  
